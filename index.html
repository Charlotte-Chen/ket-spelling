const SLUG=w=>w.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let AUD=null,SPK=0;function pf(src,fb,id){return new Promise(r=>{if(id!==SPK)return r();const a=new Audio(src);AUD=a;let d=0;const ok=()=>{if(!d){d=1;r()}};const bad=()=>{if(!d){d=1;try{say(fb,()=>r())}catch(e){r()}}};a.onended=ok;a.onerror=bad;a.play().catch(bad)})}const gap=()=>new Promise(r=>setTimeout(r,500));async function speak(w){const id=++SPK;try{speechSynthesis.cancel()}catch(e){}if(AUD)AUD.pause();const s=SLUG(w);await pf('audio/w/'+s+'.mp3',w,id);if(!SENT[w])return;await gap();await pf('audio/s/'+s+'.mp3',SENT[w],id);await gap();await pf('audio/w/'+s+'.mp3',w,id)}async function speakS(w){const id=++SPK;try{speechSynthesis.cancel()}catch(e){}if(AUD)AUD.pause();await pf(SENT[w]?'audio/s/'+SLUG(w)+'.mp3':'audio/w/'+SLUG(w)+'.mp3',SENT[w]||w,id)}

const isPh=w=>RULES.some(r=>DATA.phonics[r].includes(w));
const ketAll=[...new Set(TOPICS.flatMap(t=>DATA.topics[t]))];const nAll=new Set([...ketAll,...RULES.flatMap(r=>DATA.phonics[r])]).size;
function pickToday(force){
 if(!force&&S.todayDate===today()&&S.todayList.length)return S.todayList;
 const t=today();let r=S.rule;
 while(r<RULES.length-1&&DATA.phonics[RULES[r]].every(w=>['mastered','known'].includes(W(w).st)))r++;S.rule=r;
 let ph=[];for(let i=r;i<RULES.length&&ph.length<6;i++)ph.push(...DATA.phonics[RULES[i]].filter(w=>!['mastered','known'].includes(W(w).st)&&W(w).due<=t&&!ph.includes(w)));
 ph=ph.slice(0,6);
 const lr=Object.keys(S.w).filter(w=>S.w[w].st==='learning'&&!ph.includes(w));
 let rest=[...lr.filter(w=>S.w[w].due<=t).sort((a,b)=>S.w[a].due-S.w[b].due)];
 if(rest.length<10-ph.length)rest.push(...ketAll.filter(w=>W(w).st==='new'&&!ph.includes(w)&&!rest.includes(w)).slice(0,10-ph.length-rest.length));
 S.todayList=[...ph,...rest].slice(0,10);S.todayDate=t;S.done={};save();return S.todayList}
function grade(w,ok,mode){const x=W(w),t=today();
 if(mode==='screen'){if(ok){x.st='known'}else{x.st='learning';x.k=0;x.due=t+DAY}}
 else{if(ok){x.k++;if(x.k>=3){x.st='mastered'}else{x.st='learning';x.due=t+[1,3,7][x.k]*DAY}}else{x.st='learning';x.k=0;x.due=t+DAY}}
 save()}
let view='today',idx=0,shown=false,topic=RULES[0];
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));const A=document.getElementById('app');
 if(view==='today'){const L=pickToday(),n=Object.keys(S.done).length;
  if(idx>=L.length){A.innerHTML=`<div class="card"><div class="word">🎉 Great job!</div><p>今天 ${L.length} 字完成，答對 ${Object.values(S.done).filter(v=>v).length} 個。</p><div class="row"><button onclick="printToday()">🖨 列印今日單</button><button onclick="idx=0;render()">再看一次</button></div></div>`;return}
  const w=L[idx];A.innerHTML=`<div class="muted">第 ${idx+1} / ${L.length} 字 · ${isPh(w)?'發音規則字':'KET/錯字'} · 連對 ${W(w).k}/3</div>
  <div class="card"><div class="row"><button class="big" onclick="speak(this.dataset.w)" data-w="${w}">🔊</button><button class="big" onclick="speakS(this.dataset.w)" data-w="${w}">💬</button></div><div class="word">${shown?w:'· · ·'}</div><div class="sent">${shown?(SENT[w]||''):''}</div>
  <div class="row"><button onclick="shown=!shown;render()">${shown?'藏起來':'👀 Show'}</button></div>
  <div class="row"><button class="big ok" onclick="mark(true)">✓</button><button class="big no" onclick="mark(false)">✗</button></div></div>
  <div class="row"><button onclick="printToday()">🖨 列印今日單</button><button onclick="if(confirm('重新挑今天的 10 字？')){pickToday(true);idx=0;render()}">重新挑字</button></div>
  <p class="muted">目前規則：${RULES[S.rule]}</p>`;speak(w)}
 if(view==='screen'){const list=(DATA.topics[topic]||DATA.phonics[topic]).filter(w=>W(w).st==='new');
  const og=(l,a)=>`<optgroup label="${l}">`+a.map(t=>`<option ${t===topic?'selected':''}>${t}</option>`).join('')+'</optgroup>';const opts=og('Starter phonics',RULES.filter(r=>!RG.includes(r)))+og('Topics',TG)+og('Other Words (not in topics)',OG)+og('By spelling rule',RG);
  A.innerHTML=`<div class="card"><select onchange="topic=this.value;idx=0;shown=false;render()">${opts}</select><p class="muted">還有 ${list.length} 個沒篩過。✓ = 已會，✗ = 放進學習清單</p></div>`+
  (list.length?`<div class="card"><div class="row"><button class="big" onclick="speak(this.dataset.w)" data-w="${list[0]}">🔊</button><button class="big" onclick="speakS(this.dataset.w)" data-w="${list[0]}">💬</button></div><div class="word">${shown?list[0]:'· · ·'}</div><div class="sent">${shown?(SENT[list[0]]||''):''}</div><div class="row"><button onclick="shown=!shown;render()">${shown?'藏起來':'👀 Show'}</button></div><div class="row"><button class="big ok" onclick="grade('${list[0]}',true,'screen');shown=false;render()">✓</button><button class="big no" onclick="grade('${list[0]}',false,'screen');shown=false;render()">✗</button></div></div>`:'<div class="card">這個主題篩完了 👍</div>');
  if(list.length)speak(list[0])}
 if(view==='progress'){const rows=[...RULES.filter(r=>!RG.includes(r)),...TG,...OG,...RG].map(t=>{const ws=DATA.topics[t]||DATA.phonics[t],c={new:0,known:0,learning:0,mastered:0};ws.forEach(w=>c[W(w).st]++);const p=Math.round((c.known+c.mastered)/ws.length*100);return `<tr><td>${t}<div class="bar"><i style="width:${p}%"></i></div></td><td>${c.known}</td><td>${c.learning}</td><td>${c.mastered}</td><td>${ws.length}</td></tr>`}).join('');
  A.innerHTML=`<div class="card" style="text-align:left"><table><tr><th>主題</th><th>已會</th><th>學習中</th><th>精熟</th><th>總數</th></tr>${rows}</table></div>`}
 if(view==='more'){const n=Object.values(S.w).filter(x=>x.st==='learning').length;
  A.innerHTML=`<div class="card"><div class="row"><button onclick="printToday()">🖨 列印今日 10 字</button><button onclick="printErrors()">🖨 列印錯字清單（${n}）</button></div></div>
  <div class="card"><div class="row"><button onclick="exportJ()">⬇️ 匯出備份</button><button onclick="document.getElementById('f').click()">⬆️ 匯入備份</button></div><input type="file" id="f" accept=".json" hidden onchange="importJ(this)"><p class="muted">資料存在這支手機的瀏覽器裡。換手機或清除瀏覽器前，先匯出備份。</p></div>`}
}
function mark(ok){const w=S.todayList[idx];grade(w,ok,'today');S.done[w]=ok;save();idx++;shown=false;render()}
function sheet(title,words){const d=new Date().toLocaleDateString('en-GB');document.getElementById('print').innerHTML=`<h1>${title}</h1><div style="font-size:14pt;margin-bottom:6mm">Name: ____________ &nbsp; Date: ${d}</div>`+
 (words.length<=12?words.map((w,i)=>`<div class="pl"><b>${i+1}.</b></div>`).join(''):'')+
 `<div class="fold">✂ fold here – Answers<div class="${words.length<=12?'ans':'cols'}">${words.map((w,i)=>`<div>${i+1}. <b>${w}</b>${words.length<=12&&SENT[w]?' – '+SENT[w]:''}</div>`).join('')}</div></div>`;setTimeout(()=>print(),50)}
function printToday(){sheet('Spelling – Today',pickToday())}
function printErrors(){sheet('My Learning List',Object.keys(S.w).filter(w=>S.w[w].st==='learning'))}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='ket-spelling-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importJ(el){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();alert('匯入完成');render()}catch(e){alert('檔案格式不對')}};r.readAsText(el.files[0])}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;idx=0;shown=false;render()});
if(location.hash==='#printtest'){pickToday();sheet('Spelling – Today',S.todayList);}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
